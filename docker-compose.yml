version: '3.8'

services:
  ingest-script:
    build:
      context: .
      dockerfile: Dockerfile
    # Command to execute when the container starts
    # This will be triggered manually or by the Server Action later
    # command: ["python", "/app/scripts/ingest.py"]
    volumes:
      - ./scripts:/app/scripts       # Mount local scripts dir to container's /app/scripts
      - ./data:/app/data             # Mount local data dir for input CSVs
      - ./processed_data:/app/processed_data # Mount local dir for output JSONs
    # Optional: environment variables if needed for the script
    # environment:
      # - EXAMPLE_VAR=example_value
    working_dir: /app

# Add other services like the Next.js app if needed later
